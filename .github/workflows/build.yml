name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
          - name: macos-universal
            os: macos-latest
            platform: macos
            arch: universal

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Build debug
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug -j4

      - name: Build release
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: |
            demo/addons/flip_water_simulation/bin/*.so
            demo/addons/flip_water_simulation/bin/*.dll
            demo/addons/flip_water_simulation/bin/*.framework
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: demo/addons/flip_water_simulation/bin
          merge-multiple: true

      - name: Zip addon
        working-directory: demo
        run: zip -r ../flip_water_simulation.zip addons/flip_water_simulation -x '*.import' '*/.gitkeep'

      - uses: actions/upload-artifact@v4
        with:
          name: flip_water_simulation
          path: flip_water_simulation.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flip_water_simulation.zip
          generate_release_notes: true
